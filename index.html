<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数独挑战</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Sudoku</p>
        <h1 id="page-title">数独挑战</h1>
        <p class="intro">
          填入 1 到 9，让每一行、每一列和每一个 3x3 宫格都不重复。
        </p>
      </section>

      <section class="game-card" aria-label="数独棋盘">
        <div class="board" data-board></div>

        <aside class="panel" aria-live="polite">
          <h2>提示</h2>
          <p data-status></p>
          <p class="hint" data-hint></p>
          <div class="actions">
            <button type="button" data-check>检查答案</button>
            <button type="button" class="secondary" data-reset>重新开始</button>
          </div>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
